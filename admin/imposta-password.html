<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">

    <title>Imposta password | Turrin Elettronica</title>

    <link rel="icon" href="../images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(135deg, #f5f9ff, #eaf2fc);
            color: #162033;
            font-family: Arial, Helvetica, sans-serif;
        }

        .password-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #dde6f0;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 15px 45px rgba(20, 45, 80, 0.12);
        }

        .logo {
            margin-bottom: 6px;
            color: #0759d8;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0;
            color: #071b3a;
            font-size: 27px;
        }

        .subtitle {
            margin: 9px 0 26px;
            color: #6b7686;
            font-size: 14px;
            line-height: 1.5;
        }

        .account {
            display: none;
            margin: -10px 0 24px;
            padding: 10px 12px;
            border-radius: 7px;
            background: #f4f7fb;
            color: #4f5d70;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            color: #29384d;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ccd7e4;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #0759d8;
            box-shadow: 0 0 0 3px rgba(7, 89, 216, 0.1);
        }

        .hint {
            margin: -8px 0 18px;
            color: #738095;
            font-size: 12px;
            line-height: 1.45;
        }

        button,
        .login-link {
            width: 100%;
            min-height: 47px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 7px;
            background: #0759d8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        .login-link:hover { background: #064ab0; }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            margin-top: 18px;
            padding: 11px 13px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.45;
        }

        .message.info {
            color: #254b76;
            background: #eef6ff;
        }

        .message.error {
            color: #a32020;
            background: #fff0f0;
        }

        .message.success {
            color: #176328;
            background: #edfaef;
        }

        #passwordForm,
        #loginLink { display: none; }
    </style>
</head>

<body>
    <main class="password-card">
        <div class="logo">Turrin Elettronica</div>

        <h1>Imposta la password</h1>

        <p class="subtitle">
            Completa l'attivazione dell'account amministratore scegliendo una password personale.
        </p>

        <div id="account" class="account"></div>

        <form id="passwordForm">
            <div class="form-group">
                <label for="password">Nuova password</label>
                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required
                >
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Conferma password</label>
                <input
                    id="passwordConfirm"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="128"
                    required
                >
            </div>

            <p class="hint">
                Usa almeno 12 caratteri. È consigliata una password lunga e unica.
            </p>

            <button id="saveButton" type="submit">
                Salva password
            </button>
        </form>

        <a id="loginLink" class="login-link" href="index.html">
            Vai all'accesso admin
        </a>

        <div id="message" class="message info" aria-live="polite">
            Verifica dell'invito in corso...
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            'https://gxlquwudampvcuxiocmh.supabase.co';

        const SUPABASE_KEY =
            'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        detectSessionInUrl: true,
                        persistSession: true,
                        autoRefreshToken: true
                    }
                }
            );

        const passwordForm =
            document.getElementById('passwordForm');

        const passwordInput =
            document.getElementById('password');

        const passwordConfirmInput =
            document.getElementById('passwordConfirm');

        const saveButton =
            document.getElementById('saveButton');

        const message =
            document.getElementById('message');

        const account =
            document.getElementById('account');

        const loginLink =
            document.getElementById('loginLink');

        let inviteReady = false;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function showPasswordForm(user) {
            if (inviteReady)
                return;

            inviteReady = true;

            if (user?.email) {
                account.textContent = 'Account: ' + user.email;
                account.style.display = 'block';
            }

            passwordForm.style.display = 'block';
            showMessage(
                'Invito verificato. Puoi scegliere la nuova password.',
                'info'
            );

            passwordInput.focus();
        }

        async function verifyInviteSession() {
            try {
                const {
                    data: sessionData,
                    error: sessionError
                } = await supabaseClient.auth.getSession();

                if (sessionError)
                    throw sessionError;

                if (!sessionData?.session) {
                    showMessage(
                        'Il link di invito non è valido oppure è scaduto. Chiedi all’amministratore di inviare un nuovo invito.',
                        'error'
                    );
                    return;
                }

                const {
                    data: userData,
                    error: userError
                } = await supabaseClient.auth.getUser();

                if (userError || !userData?.user) {
                    throw userError || new Error('Utente non disponibile.');
                }

                showPasswordForm(userData.user);
            }
            catch (error) {
                console.error('Errore verifica invito:', error);

                showMessage(
                    'Non è stato possibile verificare l’invito. Richiedi un nuovo link e riprova.',
                    'error'
                );
            }
        }

        passwordForm.addEventListener(
            'submit',
            async event => {
                event.preventDefault();

                if (!inviteReady)
                    return;

                const password = passwordInput.value;
                const passwordConfirm = passwordConfirmInput.value;

                if (password.length < 12) {
                    showMessage(
                        'La password deve contenere almeno 12 caratteri.',
                        'error'
                    );
                    return;
                }

                if (password !== passwordConfirm) {
                    showMessage(
                        'Le due password non coincidono.',
                        'error'
                    );
                    return;
                }

                saveButton.disabled = true;
                saveButton.textContent = 'Salvataggio...';

                try {
                    const {
                        error
                    } = await supabaseClient.auth.updateUser({
                        password: password
                    });

                    if (error)
                        throw error;

                    /*
                     * Chiudiamo la sessione creata dal link di invito.
                     * In questo modo il nuovo admin testerà poi il normale
                     * accesso con email + password e Turnstile.
                     */
                    await supabaseClient.auth.signOut({
                        scope: 'local'
                    });

                    passwordForm.style.display = 'none';
                    account.style.display = 'none';
                    loginLink.style.display = 'inline-flex';

                    showMessage(
                        'Password impostata correttamente. Ora puoi accedere all’area amministrazione con la tua email e la nuova password.',
                        'success'
                    );
                }
                catch (error) {
                    console.error('Errore cambio password:', error);

                    showMessage(
                        error?.message ||
                        'Impossibile impostare la password. Riprova.',
                        'error'
                    );

                    saveButton.disabled = false;
                    saveButton.textContent = 'Salva password';
                }
            }
        );

        verifyInviteSession();
    </script>
</body>
</html>
