<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nuovo aggiornamento | Turrin Elettronica
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            color: #162033;
            background: #f5f8fc;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .admin-header {
            min-height: 68px;

            display: flex;
            align-items: center;

            background: #071b3a;
            color: #ffffff;
        }


        .header-inner {
            width: min(
                900px,
                calc(100% - 40px)
            );

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .admin-header h1 {
            margin: 0;

            font-size: 20px;
        }


        .back-link {
            color: #ffffff;

            font-size: 13px;
            font-weight: 700;

            text-decoration: none;
        }


        .container {
            width: min(
                900px,
                calc(100% - 40px)
            );

            margin: 0 auto;

            padding: 40px 0;
        }


        .page-title {
            margin-bottom: 24px;
        }


        .page-title h2 {
            margin: 0;

            color: #071b3a;

            font-size: 28px;
        }


        .page-title p {
            margin: 8px 0 0;

            color: #6a7585;

            font-size: 14px;
        }


        .form-card {
            padding: 30px;

            border: 1px solid #dde5ef;
            border-radius: 12px;

            background: #ffffff;

            box-shadow:
                0 8px 30px
                rgba(21, 42, 75, .07);
        }


        .form-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group.full {
            grid-column: 1 / -1;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #29384d;

            font-size: 13px;
            font-weight: 700;
        }


        input,
        select,
        textarea {
            width: 100%;

            border: 1px solid #ccd7e4;
            border-radius: 7px;

            outline: none;

            background: #ffffff;

            font: inherit;
        }


        input,
        select {
            height: 46px;

            padding: 0 12px;
        }


        textarea {
            min-height: 120px;

            padding: 12px;

            resize: vertical;
        }


        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0759d8;

            box-shadow:
                0 0 0 3px
                rgba(7, 89, 216, .1);
        }


        .publish-row {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 5px;
        }


        .publish-row input {
            width: 18px;
            height: 18px;
        }


        .actions {
            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 28px;
        }


        .button {
            min-height: 44px;

            padding: 0 20px;

            border-radius: 7px;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }


        .button-secondary {
            border: 1px solid #cfd9e5;

            color: #344258;
            background: #ffffff;
        }


        .button-primary {
            border: 1px solid #0759d8;

            color: #ffffff;
            background: #0759d8;
        }


        .button-primary:hover {
            background: #064ab0;
        }


        .button:disabled {
            opacity: .6;

            cursor: wait;
        }


        .message {
            display: none;

            margin-top: 20px;

            padding: 12px 14px;

            border-radius: 7px;

            font-size: 13px;
        }


        .message.error {
            display: block;

            color: #a82d2d;
            background: #fff0f0;
        }


        .message.success {
            display: block;

            color: #176328;
            background: #edf9ef;
        }


        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }


            .form-group.full {
                grid-column: auto;
            }


            .form-card {
                padding: 22px;
            }

        }

    </style>

</head>


<body>

    <header class="admin-header">

        <div class="header-inner">

            <h1>
                Turrin Elettronica — Admin
            </h1>

            <a
                class="back-link"
                href="dashboard.html">
                ← Torna alla dashboard
            </a>

        </div>

    </header>


    <main class="container">

        <div class="page-title">

            <h2>
                Nuovo aggiornamento
            </h2>

            <p>
                Inserisci le informazioni da pubblicare sul sito.
            </p>

        </div>


        <form
            id="updateForm"
            class="form-card">


            <div class="form-grid">


                <div class="form-group">

                    <label for="product">
                        Prodotto
                    </label>

                    <select
                        id="product"
                        required>

                        <option value="">
                            Seleziona prodotto
                        </option>

                        <option
                            value="mc3"
                            data-name="MC3">
                            MC3
                        </option>

                        <option
                            value="trace"
                            data-name="T-Race Pro">
                            T-Race Pro
                        </option>

                        <option
                            value="tuning"
                            data-name="Tuning Solution">
                            Tuning Solution
                        </option>

                        <option
                            value="check"
                            data-name="Check ECU">
                            Check ECU
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="version">
                        Versione
                    </label>

                    <input
                        id="version"
                        type="text"
                        placeholder="Es. 1.2.6.0"
                    >

                </div>


                <div class="form-group full">

                    <label for="title">
                        Titolo
                    </label>

                    <input
                        id="title"
                        type="text"
                        required
                        placeholder="Es. MC3 versione 1.2.6.0"
                    >

                </div>


                <div class="form-group">

                    <label for="publishedAt">
                        Data pubblicazione
                    </label>

                    <input
                        id="publishedAt"
                        type="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stato
                    </label>

                    <div class="publish-row">

                        <input
                            id="published"
                            type="checkbox"
                        >

                        <label for="published">
                            Pubblica subito sul sito
                        </label>

                    </div>

                </div>


                <div class="form-group full">

                    <label for="description">
                        Descrizione breve
                    </label>

                    <textarea
                        id="description"
                        placeholder="Testo breve mostrato nella card della home."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label for="content">
                        Contenuto completo
                    </label>

                    <textarea
                        id="content"
                        placeholder="Testo completo dell'aggiornamento."
                    ></textarea>

                </div>


            </div>


            <div class="actions">

                <button
                    class="button button-secondary"
                    id="cancelButton"
                    type="button">
                    Annulla
                </button>


                <button
                    class="button button-primary"
                    id="saveButton"
                    type="submit">
                    Salva aggiornamento
                </button>

            </div>


            <div
                id="message"
                class="message">
            </div>

        </form>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script>

        /* =====================================
           SUPABASE
           ===================================== */

        const SUPABASE_URL =
            'https://gxlquwudampvcuxiocmh.supabase.co';


        const SUPABASE_KEY =
            'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================
           ELEMENTI
           ===================================== */

        const updateForm =
            document.getElementById(
                'updateForm'
            );


        const productSelect =
            document.getElementById(
                'product'
            );


        const versionInput =
            document.getElementById(
                'version'
            );


        const titleInput =
            document.getElementById(
                'title'
            );


        const publishedAtInput =
            document.getElementById(
                'publishedAt'
            );


        const publishedInput =
            document.getElementById(
                'published'
            );


        const descriptionInput =
            document.getElementById(
                'description'
            );


        const contentInput =
            document.getElementById(
                'content'
            );


        const saveButton =
            document.getElementById(
                'saveButton'
            );


        const cancelButton =
            document.getElementById(
                'cancelButton'
            );


        const message =
            document.getElementById(
                'message'
            );


        /* =====================================
           DATA DI OGGI
           ===================================== */

        const today =
            new Date();


        publishedAtInput.value =
            [
                today.getFullYear(),
                String(
                    today.getMonth() + 1
                ).padStart(2, '0'),
                String(
                    today.getDate()
                ).padStart(2, '0')
            ].join('-');


        /* =====================================
           CONTROLLO UTENTE
           ===================================== */

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (
                error ||
                !data.user
            ) {

                window.location.href =
                    'index.html';

                return false;
            }


            return true;
        }


        /* =====================================
           TITOLO AUTOMATICO
           ===================================== */

        function updateSuggestedTitle() {

            const option =
                productSelect
                    .options[
                        productSelect.selectedIndex
                    ];


            if (
                !option ||
                !option.value
            ) {
                return;
            }


            const productName =
                option.dataset.name;


            const version =
                versionInput.value.trim();


            if (version) {

                titleInput.value =
                    productName +
                    ' versione ' +
                    version;
            }
        }


        productSelect.addEventListener(
            'change',
            updateSuggestedTitle
        );


        versionInput.addEventListener(
            'input',
            updateSuggestedTitle
        );


        /* =====================================
           MESSAGGI
           ===================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;


            message.className =
                'message ' + type;
        }


        /* =====================================
           ANNULLA
           ===================================== */

        cancelButton.addEventListener(
            'click',
            () => {

                window.location.href =
                    'dashboard.html';
            }
        );


        /* =====================================
           SALVA
           ===================================== */

        updateForm.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();


                const option =
                    productSelect
                        .options[
                            productSelect.selectedIndex
                        ];


                const productKey =
                    option.value;


                const productName =
                    option.dataset.name;


                if (
                    !productKey ||
                    !productName
                ) {

                    showMessage(
                        'Seleziona un prodotto.',
                        'error'
                    );

                    return;
                }


                saveButton.disabled =
                    true;


                saveButton.textContent =
                    'Salvataggio...';


                /*
                 * published_at è timestamptz.
                 * Usiamo mezzogiorno per evitare
                 * problemi di cambio data dovuti
                 * al fuso orario.
                 */
                const publishedAt =
                    new Date(
                        publishedAtInput.value +
                        'T12:00:00'
                    )
                    .toISOString();


                const newUpdate = {

                    product_key:
                        productKey,

                    product_name:
                        productName,

                    version:
                        versionInput.value.trim()
                        || null,

                    title:
                        titleInput.value.trim(),

                    description:
                        descriptionInput.value.trim()
                        || null,

                    content:
                        contentInput.value.trim()
                        || null,

                    image_path:
                        null,

                    published_at:
                        publishedAt,

                    published:
                        publishedInput.checked
                };


                const {
                    error
                } =
                    await supabaseClient
                        .from('updates')
                        .insert(
                            newUpdate
                        );


                if (error) {

                    console.error(error);


                    showMessage(
                        'Errore durante il salvataggio: ' +
                        error.message,
                        'error'
                    );


                    saveButton.disabled =
                        false;


                    saveButton.textContent =
                        'Salva aggiornamento';


                    return;
                }


                showMessage(
                    publishedInput.checked
                        ? 'Aggiornamento pubblicato correttamente.'
                        : 'Aggiornamento salvato come bozza.',
                    'success'
                );


                setTimeout(
                    () => {

                        window.location.href =
                            'dashboard.html';

                    },
                    800
                );

            }
        );


        /* =====================================
           AVVIO
           ===================================== */

        checkUser();

    </script>

</body>

</html>
