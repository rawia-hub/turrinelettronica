<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Recupera password | Turrin Elettronica</title>

    <link rel="icon" href="../images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(135deg, #f5f9ff, #eaf2fc);
            color: #162033;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #dde6f0;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 15px 45px rgba(20, 45, 80, 0.12);
        }
        .logo {
            margin-bottom: 6px;
            color: #0759d8;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        h1 {
            margin: 0;
            color: #071b3a;
            font-size: 27px;
        }
        .subtitle {
            margin: 9px 0 26px;
            color: #6b7686;
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 7px;
            color: #29384d;
            font-size: 13px;
            font-weight: 700;
        }
        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ccd7e4;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }
        input:focus {
            border-color: #0759d8;
            box-shadow: 0 0 0 3px rgba(7, 89, 216, 0.1);
        }
        button,
        .back-link {
            width: 100%;
            min-height: 47px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 7px;
            background: #0759d8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover,
        .back-link:hover { background: #064ab0; }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .back-link {
            margin-top: 12px;
            background: #eef3f9;
            color: #24415f;
        }
        .back-link:hover {
            background: #e2eaf3;
        }
        .message {
            display: none;
            margin-top: 18px;
            padding: 11px 13px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.45;
        }
        .message.info {
            display: block;
            color: #254b76;
            background: #eef6ff;
        }
        .message.error {
            display: block;
            color: #a32020;
            background: #fff0f0;
        }
        .message.success {
            display: block;
            color: #176328;
            background: #edfaef;
        }

        .turnstile-wrap {
            width: 100%;
            min-height: 0;
            margin: 10px 0 0;
            overflow: visible;
        }

        .turnstile-wrap:empty {
            display: none;
        }

        .turnstile-wrap > div {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">Turrin Elettronica</div>
        <h1>Password dimenticata</h1>
        <p class="subtitle">
            Inserisci l'email dell'account amministratore. Se l'indirizzo è associato a un account, riceverai un link per scegliere una nuova password.
        </p>

        <form id="recoveryForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <button id="sendButton" type="submit">Invia link di recupero</button>

            <div
                id="recoveryTurnstile"
                class="turnstile-wrap"
                aria-live="polite">
            </div>
        </form>

        <a class="back-link" href="index.html">Torna all'accesso admin</a>
        <div id="message" class="message" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script>
    <script>
        const SUPABASE_URL = 'https://gxlquwudampvcuxiocmh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';
        const TURNSTILE_SITE_KEY = '0x4AAAAAAEk3BroGgbq1bBWm';

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const form = document.getElementById('recoveryForm');
        const emailInput = document.getElementById('email');
        const sendButton = document.getElementById('sendButton');
        const message = document.getElementById('message');
        const turnstileContainer = document.getElementById('recoveryTurnstile');

        let turnstileWidgetId = null;

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function clearTurnstileWidget() {
            if (window.turnstile && turnstileWidgetId !== null) {
                try {
                    window.turnstile.remove(turnstileWidgetId);
                }
                catch (error) {
                    console.warn('Reset Turnstile:', error);
                }
            }

            turnstileWidgetId = null;

            if (turnstileContainer) {
                turnstileContainer.innerHTML = '';
            }
        }

        function getTurnstileToken() {
            if (!TURNSTILE_SITE_KEY) {
                return Promise.reject(
                    new Error('Turnstile Site Key non configurata.')
                );
            }

            if (
                !window.turnstile ||
                typeof window.turnstile.render !== 'function'
            ) {
                return Promise.reject(
                    new Error('Cloudflare Turnstile non disponibile.')
                );
            }

            clearTurnstileWidget();

            return new Promise((resolve, reject) => {
                let completed = false;

                const finish = callback => value => {
                    if (completed) return;
                    completed = true;
                    callback(value);
                };

                const resolveOnce = finish(resolve);
                const rejectOnce = finish(reject);

                try {
                    turnstileWidgetId = window.turnstile.render(
                        turnstileContainer,
                        {
                            sitekey: TURNSTILE_SITE_KEY,
                            theme: 'light',
                            language: 'it',
                            size: 'flexible',
                            appearance: 'interaction-only',
                            execution: 'execute',
                            action: 'admin_password_recovery',
                            'response-field': false,

                            callback: token => {
                                if (!token) {
                                    rejectOnce(
                                        new Error('Turnstile non ha restituito un token.')
                                    );
                                    return;
                                }

                                resolveOnce(token);
                            },

                            'error-callback': errorCode => {
                                rejectOnce(
                                    new Error(`Turnstile error ${errorCode}`)
                                );
                                return true;
                            },

                            'expired-callback': () => {
                                rejectOnce(
                                    new Error('Turnstile token scaduto.')
                                );
                            },

                            'timeout-callback': () => {
                                rejectOnce(
                                    new Error('Turnstile timeout.')
                                );
                            }
                        }
                    );

                    if (
                        turnstileWidgetId === undefined ||
                        turnstileWidgetId === null
                    ) {
                        rejectOnce(
                            new Error('Impossibile inizializzare Turnstile.')
                        );
                        return;
                    }

                    window.turnstile.execute(turnstileWidgetId);
                }
                catch (error) {
                    rejectOnce(error);
                }
            });
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            if (!email) return;

            sendButton.disabled = true;
            sendButton.textContent = 'Invio in corso...';

            try {
                const captchaToken = await getTurnstileToken();

                const redirectTo =
                    new URL('imposta-password.html', window.location.href).href;

                const { error } =
                    await supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo,
                            captchaToken
                        }
                    );

                clearTurnstileWidget();

                if (error) throw error;

                // Messaggio volutamente generico per non rivelare se l'email esiste.
                showMessage(
                    'Se l\'indirizzo appartiene a un account amministratore, riceverai a breve un\'email con il link per reimpostare la password.',
                    'success'
                );

                form.reset();
            }
            catch (error) {
                console.error('Errore recupero password:', error);
                clearTurnstileWidget();

                const msg = String(error?.message || '').toLowerCase();

                if (msg.includes('captcha')) {
                    showMessage(
                        'Verifica di sicurezza non riuscita. Riprova.',
                        'error'
                    );
                }
                else {
                    showMessage(
                        'Non è stato possibile inviare la richiesta in questo momento. Riprova.',
                        'error'
                    );
                }
            }
            finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Invia link di recupero';
            }
        });
    </script>
</body>
</html>
