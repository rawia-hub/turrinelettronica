<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Recupera password | Turrin Elettronica</title>

    <link rel="icon" href="../images/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/favicon/apple-touch-icon.png">
    <link rel="manifest" href="../site.webmanifest">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: linear-gradient(135deg, #f5f9ff, #eaf2fc);
            color: #162033;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid #dde6f0;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 15px 45px rgba(20, 45, 80, 0.12);
        }
        .logo {
            margin-bottom: 6px;
            color: #0759d8;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        h1 {
            margin: 0;
            color: #071b3a;
            font-size: 27px;
        }
        .subtitle {
            margin: 9px 0 26px;
            color: #6b7686;
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group { margin-bottom: 18px; }
        label {
            display: block;
            margin-bottom: 7px;
            color: #29384d;
            font-size: 13px;
            font-weight: 700;
        }
        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ccd7e4;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
        }
        input:focus {
            border-color: #0759d8;
            box-shadow: 0 0 0 3px rgba(7, 89, 216, 0.1);
        }
        button,
        .back-link {
            width: 100%;
            min-height: 47px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 7px;
            background: #0759d8;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover,
        .back-link:hover { background: #064ab0; }
        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
        .back-link {
            margin-top: 12px;
            background: #eef3f9;
            color: #24415f;
        }
        .back-link:hover {
            background: #e2eaf3;
        }
        .message {
            display: none;
            margin-top: 18px;
            padding: 11px 13px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.45;
        }
        .message.info {
            display: block;
            color: #254b76;
            background: #eef6ff;
        }
        .message.error {
            display: block;
            color: #a32020;
            background: #fff0f0;
        }
        .message.success {
            display: block;
            color: #176328;
            background: #edfaef;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">Turrin Elettronica</div>
        <h1>Password dimenticata</h1>
        <p class="subtitle">
            Inserisci l'email dell'account amministratore. Se l'indirizzo è associato a un account, riceverai un link per scegliere una nuova password.
        </p>

        <form id="recoveryForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <button id="sendButton" type="submit">Invia link di recupero</button>
        </form>

        <a class="back-link" href="index.html">Torna all'accesso admin</a>
        <div id="message" class="message" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gxlquwudampvcuxiocmh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );

        const form = document.getElementById('recoveryForm');
        const emailInput = document.getElementById('email');
        const sendButton = document.getElementById('sendButton');
        const message = document.getElementById('message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = emailInput.value.trim();
            if (!email) return;

            sendButton.disabled = true;
            sendButton.textContent = 'Invio in corso...';

            try {
                const redirectTo = new URL('imposta-password.html', window.location.href).href;

                const { error } = await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    { redirectTo }
                );

                if (error) throw error;

                // Messaggio volutamente generico per non rivelare se l'email esiste.
                showMessage(
                    'Se l\'indirizzo appartiene a un account amministratore, riceverai a breve un\'email con il link per reimpostare la password.',
                    'success'
                );

                form.reset();
            }
            catch (error) {
                console.error('Errore recupero password:', error);

                showMessage(
                    'Non è stato possibile inviare la richiesta in questo momento. Attendi qualche minuto e riprova.',
                    'error'
                );
            }
            finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Invia link di recupero';
            }
        });
    </script>
</body>
</html>
