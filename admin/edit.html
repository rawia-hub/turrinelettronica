    <script

    <script>

        /* =====================================
           SUPABASE
           ===================================== */

        const SUPABASE_URL =
            'https://gxlquwudampvcuxiocmh.supabase.co';


        const SUPABASE_KEY =
            'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        const params =
            new URLSearchParams(
                window.location.search
            );
        
        const updateId =
            params.get('id');
        
        
        if (!updateId) {
        
            window.location.href =
                'dashboard.html';
        }
        /* =====================================
           ELEMENTI
           ===================================== */
        const removeImageButton =
            document.getElementById(
                'removeImageButton'
            );
        const updateForm =
            document.getElementById(
                'updateForm'
            );


        const productSelect =
            document.getElementById(
                'product'
            );


        const versionInput =
            document.getElementById(
                'version'
            );


        const titleInput =
            document.getElementById(
                'title'
            );


        const publishedAtInput =
            document.getElementById(
                'publishedAt'
            );


        const publishedInput =
            document.getElementById(
                'published'
            );


        const descriptionInput =
            document.getElementById(
                'description'
            );

        const contentEditor =
            new Quill(
                '#contentEditor',
                {
                    theme: 'snow',
        
                    modules: {
        
                        toolbar:
                            '#contentToolbar'
                    },
        
                    formats: [
                        'header',
                        'bold',
                        'italic',
                        'underline',
                        'list',
                        'link'
                    ]
                }
            );
      


        const saveButton =
            document.getElementById(
                'saveButton'
            );


        const cancelButton =
            document.getElementById(
                'cancelButton'
            );


        const message =
            document.getElementById(
                'message'
            );
        const imageInput =
            document.getElementById('image');
        const currentImagePreview =
            document.getElementById(
                'currentImagePreview'
            );
        
        
        const noCurrentImage =
            document.getElementById(
                'noCurrentImage'
            );
        
        
        const newImageBox =
            document.getElementById(
                'newImageBox'
            );
        
        
        const newImagePreview =
            document.getElementById(
                'newImagePreview'
            );

        /* =====================================
           DATA DI OGGI
           ===================================== */

        const today =
            new Date();


        publishedAtInput.value =
            [
                today.getFullYear(),
                String(
                    today.getMonth() + 1
                ).padStart(2, '0'),
                String(
                    today.getDate()
                ).padStart(2, '0')
            ].join('-');
      /*===================================
      carica i dati esistenti
      =====================================*/
        async function loadUpdate() {
        
            const {
                data,
                error
            } =
                await supabaseClient
                    .from('updates')
                    .select(`
                        id,
                        product_key,
                        product_name,
                        version,
                        title,
                        description,
                        content,
                        image_path,
                        published_at,
                        published
                    `)
                    .eq(
                        'id',
                        updateId
                    )
                    .single();
        
        
            if (error || !data) {
        
                console.error(error);
        
                showMessage(
                    'Aggiornamento non trovato.',
                    'error'
                );
        
                return;
            }
        
        
            productSelect.value =
                data.product_key;
        
        
            versionInput.value =
                data.version || '';
        
        
            titleInput.value =
                data.title || '';
        
        
            descriptionInput.value =
                data.description || '';
        
        
            contentEditor.clipboard.dangerouslyPasteHTML(
                data.content || ''
            );
        
            publishedInput.checked =
                data.published;
            currentImagePath =
                data.image_path || null;
        const currentImageUrl =
            getImagePublicUrl(
                currentImagePath
            );
        
        
        if (currentImageUrl) {
        
            currentImagePreview.src =
                currentImageUrl;
        
        
            currentImagePreview.style.display =
                'block';
        
        
            noCurrentImage.style.display =
                'none';
        
        }
        else {
        
            currentImagePreview.style.display =
                'none';
        
        
            noCurrentImage.style.display =
                'block';
        }
        if (data.published_at) {
    
            publishedAtInput.value =
                data.published_at
                    .substring(
                        0,
                        10
                    );
        }
      if (currentImagePath) {

            removeImageButton.style.display =
                'inline-block';
        
        }
        else {
        
            removeImageButton.style.display =
                'none';
        }
        }

        imageInput.addEventListener(
    'change',
    () => {

        const file =
            imageInput.files[0];


        if (!file) {

            newImageBox.style.display =
                'none';


            newImagePreview.src =
                '';


            return;
        }
removeCurrentImage =
    false;
noCurrentImage.style.display =
    'none';

        const allowedTypes = [
            'image/jpeg',
            'image/png',
            'image/webp'
        ];


        if (
            !allowedTypes.includes(
                file.type
            )
        ) {

            showMessage(
                'Formato immagine non valido.',
                'error'
            );


            imageInput.value =
                '';


            newImageBox.style.display =
                'none';


            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (
            file.size >
            maxSize
        ) {

            showMessage(
                'L’immagine supera i 5 MB.',
                'error'
            );


            imageInput.value =
                '';


            newImageBox.style.display =
                'none';


            return;
        }


        const previewUrl =
            URL.createObjectURL(
                file
            );


        newImagePreview.src =
            previewUrl;


        newImageBox.style.display =
            'block';

    }
);

        removeImageButton.addEventListener(
    'click',
    () => {

        if (!currentImagePath)
            return;


        const confirmed =
            window.confirm(
                'Vuoi rimuovere l’immagine da questo aggiornamento?'
            );


        if (!confirmed)
            return;


        removeCurrentImage =
            true;


        currentImagePreview.style.display =
            'none';


        noCurrentImage.style.display =
            'block';


        noCurrentImage.textContent =
            'L’immagine verrà rimossa al salvataggio.';


        removeImageButton.style.display =
            'none';


        /*
         * Se avevi anche selezionato
         * una nuova foto, la annulliamo.
         */
        imageInput.value =
            '';


        newImageBox.style.display =
            'none';


        newImagePreview.src =
            '';
    }
);
        /* =====================================
           CONTROLLO UTENTE
           ===================================== */

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (
                error ||
                !data.user
            ) {

                window.location.href =
                    'index.html';

                return false;
            }


            return true;
        }


        /* =====================================
           TITOLO AUTOMATICO
           ===================================== */

        function updateSuggestedTitle() {

            const option =
                productSelect
                    .options[
                        productSelect.selectedIndex
                    ];


            if (
                !option ||
                !option.value
            ) {
                return;
            }


            const productName =
                option.dataset.name;


            const version =
                versionInput.value.trim();


            if (version) {

                titleInput.value =
                    productName +
                    ' versione ' +
                    version;
            }
        }


        productSelect.addEventListener(
            'change',
            updateSuggestedTitle
        );


        versionInput.addEventListener(
            'input',
            updateSuggestedTitle
        );


        /* =====================================
           MESSAGGI
           ===================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;


            message.className =
                'message ' + type;
        }
        /* =====================================
           Recuperare l'url della foto corrente
           ===================================== */
        function getImagePublicUrl(
            imagePath
        ) {
        
            if (!imagePath)
                return null;
        
        
            const {
                data
            } =
                supabaseClient
                    .storage
                    .from('updates')
                    .getPublicUrl(
                        imagePath
                    );
        
        
            return data?.publicUrl
                || null;
        }

        /* =====================================
           ANNULLA
           ===================================== */

        cancelButton.addEventListener(
            'click',
            () => {

                window.location.href =
                    'dashboard.html';
            }
        );

/* =====================================
   IMMAGINE ATTUALE
   ===================================== */

let currentImagePath = null;
let removeCurrentImage = false;

/* =====================================
   SALVA MODIFICHE
   ===================================== */

updateForm.addEventListener(
    'submit',
    async (event) => {

        event.preventDefault();


        const option =
            productSelect.options[
                productSelect.selectedIndex
            ];


        const productKey =
            option.value;


        const productName =
            option.dataset.name;


        if (
            !productKey ||
            !productName
        ) {

            showMessage(
                'Seleziona un prodotto.',
                'error'
            );

            return;
        }


        saveButton.disabled =
            true;


        saveButton.textContent =
            'Salvataggio...';


        /*
         * Per default manteniamo
         * l'immagine già esistente.
         */
        let imagePath =
            removeCurrentImage
                ? null
                : currentImagePath;


        const imageFile =
            imageInput.files[0];


        /* =====================================
           SE È STATA SCELTA UNA NUOVA FOTO
           ===================================== */

        if (imageFile) {

            const allowedTypes = [
                'image/jpeg',
                'image/png',
                'image/webp'
            ];


            if (
                !allowedTypes.includes(
                    imageFile.type
                )
            ) {

                showMessage(
                    'Formato immagine non valido.',
                    'error'
                );


                saveButton.disabled =
                    false;


                saveButton.textContent =
                    'Salva modifiche';


                return;
            }


            const maxSize =
                5 * 1024 * 1024;


            if (
                imageFile.size >
                maxSize
            ) {

                showMessage(
                    'L’immagine supera i 5 MB.',
                    'error'
                );


                saveButton.disabled =
                    false;


                saveButton.textContent =
                    'Salva modifiche';


                return;
            }


            const extension =
                imageFile.name
                    .split('.')
                    .pop()
                    .toLowerCase();


            const safeProduct =
                productKey.replace(
                    /[^a-z0-9_-]/gi,
                    '-'
                );


            const fileName =
                safeProduct +
                '-' +
                Date.now() +
                '.' +
                extension;


            const {
                data: uploadData,
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from('updates')
                    .upload(
                        fileName,
                        imageFile,
                        {
                            cacheControl:
                                '3600',

                            upsert:
                                false
                        }
                    );


            if (uploadError) {

                console.error(
                    uploadError
                );


                showMessage(
                    'Errore durante il caricamento dell’immagine: ' +
                    uploadError.message,
                    'error'
                );


                saveButton.disabled =
                    false;


                saveButton.textContent =
                    'Salva modifiche';


                return;
            }


            imagePath =
                uploadData.path;
        }


        /* =====================================
           DATI MODIFICATI
           ===================================== */

        const publishedAt =
            new Date(
                publishedAtInput.value +
                'T12:00:00'
            )
            .toISOString();


        const updatedUpdate = {

            product_key:
                productKey,

            product_name:
                productName,

            version:
                versionInput.value.trim()
                || null,

            title:
                titleInput.value.trim(),

            description:
                descriptionInput.value.trim()
                || null,

            content:
                contentEditor
                .getSemanticHTML()
                .trim()
                || null,

            image_path:
                imagePath,

            published_at:
                publishedAt,

            published:
                publishedInput.checked
        };


        /* =====================================
           UPDATE - NON INSERT
           ===================================== */

        const {
            error
        } =
            await supabaseClient
                .from('updates')
                .update(
                    updatedUpdate
                )
                .eq(
                    'id',
                    updateId
                );


        if (error) {

            console.error(
                error
            );


            showMessage(
                'Errore durante la modifica: ' +
                error.message,
                'error'
            );


            saveButton.disabled =
                false;


            saveButton.textContent =
                'Salva modifiche';


            return;
        }


        /* =====================================
           SE ABBIAMO CAMBIATO FOTO,
           ELIMINIAMO QUELLA VECCHIA
           ===================================== */

        if (
            currentImagePath &&
            (
                removeCurrentImage ||
                (
                    imageFile &&
                    currentImagePath !==
                        imagePath
                )
            )
        ) {
        
            const {
                error: deleteImageError
            } =
                await supabaseClient
                    .storage
                    .from('updates')
                    .remove([
                        currentImagePath
                    ]);
        
        
            if (deleteImageError) {
        
                console.warn(
                    'Aggiornamento salvato, ma non è stato possibile eliminare la vecchia immagine:',
                    deleteImageError
                );
            }
        }


        showMessage(
            'Aggiornamento modificato correttamente.',
            'success'
        );


        setTimeout(
            () => {

                window.location.href =
                    'dashboard.html';

            },
            700
        );

    }
);

        /* =====================================
           AVVIO
           ===================================== */

        async function startPage() {

          const loggedIn =
              await checkUser();
      
      
          if (!loggedIn)
              return;
      
      
          await loadUpdate();
      }
      
      
      startPage();

    </script>

</body>

</html>
