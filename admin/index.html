<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Amministrazione | Turrin Elettronica
    </title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background:
                linear-gradient(
                    135deg,
                    #f5f9ff,
                    #eaf2fc
                );

            color: #162033;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .login-card {
            width: 100%;
            max-width: 420px;

            padding: 38px;

            border: 1px solid #dde6f0;
            border-radius: 14px;

            background: #ffffff;

            box-shadow:
                0 15px 45px
                rgba(20, 45, 80, 0.12);
        }


        .logo {
            margin-bottom: 6px;

            color: #0759d8;

            font-size: 14px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.08em;
        }


        h1 {
            margin: 0;

            color: #071b3a;

            font-size: 27px;
        }


        .subtitle {
            margin: 9px 0 30px;

            color: #6b7686;

            font-size: 14px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #29384d;

            font-size: 13px;
            font-weight: 700;
        }


        input {
            width: 100%;
            height: 46px;

            padding: 0 13px;

            border: 1px solid #ccd7e4;
            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }


        input:focus {
            border-color: #0759d8;

            box-shadow:
                0 0 0 3px
                rgba(7, 89, 216, 0.1);
        }


        button {
            width: 100%;
            height: 47px;

            margin-top: 8px;

            border: 0;
            border-radius: 7px;

            background: #0759d8;
            color: #ffffff;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
        }


        button:hover {
            background: #064ab0;
        }


        button:disabled {
            opacity: 0.6;

            cursor: wait;
        }


        .message {
            display: none;

            margin-top: 18px;

            padding: 11px 13px;

            border-radius: 6px;

            font-size: 13px;
        }


        .message.error {
            display: block;

            color: #a32020;
            background: #fff0f0;
        }


        .message.success {
            display: block;

            color: #176328;
            background: #edfaef;
        }

    </style>

</head>


<body>

    <main class="login-card">

        <div class="logo">
            Turrin Elettronica
        </div>

        <h1>
            Area amministrazione
        </h1>

        <p class="subtitle">
            Accedi per gestire gli aggiornamenti.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                id="loginButton"
                type="submit">
                Accedi
            </button>

        </form>


        <div
            id="message"
            class="message">
        </div>

    </main>


    <!-- Supabase JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script>

        /*
         * =====================================
         * CONFIGURAZIONE SUPABASE
         * =====================================
         */

        const SUPABASE_URL =
            'INCOLLA_QUI_PROJECT_URL';


        const SUPABASE_KEY =
            'INCOLLA_QUI_PUBLISHABLE_KEY';


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
         * =====================================
         * ELEMENTI PAGINA
         * =====================================
         */

        const loginForm =
            document.getElementById(
                'loginForm'
            );


        const emailInput =
            document.getElementById(
                'email'
            );


        const passwordInput =
            document.getElementById(
                'password'
            );


        const loginButton =
            document.getElementById(
                'loginButton'
            );


        const message =
            document.getElementById(
                'message'
            );


        /*
         * =====================================
         * MESSAGGI
         * =====================================
         */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                'message ' + type;
        }


        function clearMessage() {

            message.textContent =
                '';

            message.className =
                'message';
        }


        /*
         * =====================================
         * LOGIN
         * =====================================
         */

        loginForm.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();

                clearMessage();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                loginButton.disabled =
                    true;


                loginButton.textContent =
                    'Accesso...';


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password
                        });


                if (error) {

                    showMessage(
                        'Email o password non corrette.',
                        'error'
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        'Accedi';


                    return;
                }


                showMessage(
                    'Accesso effettuato.',
                    'success'
                );


                /*
                 * Nel prossimo passaggio
                 * questa pagina diventerà:
                 *
                 * dashboard.html
                 */

                setTimeout(() => {

                    window.location.href =
                        'dashboard.html';

                }, 600);

            }
        );

    </script>

</body>

</html>
