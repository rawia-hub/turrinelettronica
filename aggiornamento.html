<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Aggiornamento | Turrin Elettronica
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
<style>
    .update-detail {
    min-height: 70vh;

    padding: 55px 0 85px;

    background: #f5f8fc;
}


.update-detail-wrapper {
    width: min(
        1000px,
        calc(100% - 40px)
    );

    margin: 0 auto;
}
.update-detail-article {
    padding:30px;
}
    

.back-updates-link {
    display: inline-block;

    margin-bottom: 24px;

    color: #0759d8;

    font-size: 13px;
    font-weight: 800;

    text-decoration: none;
}


.back-updates-link:hover {
    text-decoration: underline;
}


.update-detail-container {
    width: 100%;
    max-width: none;

    margin: 0;

    overflow: hidden;

    border: 1px solid #dce5ef;
    border-radius: 12px;

    background: #ffffff;

    box-shadow:
        0 12px 35px
        rgba(20, 45, 80, .07);
}
</style>
</head>


<body>

    <!-- HEADER -->

<div id="siteHeader" data-root="./"></div>


<main>

    <section class="update-detail">

        <div class="update-detail-wrapper">

            <a
                href="aggiornamenti.html"
                class="update-detail-back back-updates-link">

                ← Tutti gli aggiornamenti

            </a>


            <div
                id="updateDetail"
                class="update-detail-container">

                <div class="update-detail-loading">
                    Caricamento aggiornamento...
                </div>

            </div>

        </div>

    </section>

</main>


    <!-- FOOTER -->

<div id="siteFooter"></div>

    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js">
    </script>

    <script>

        /* =====================================
           MENU MOBILE
           ===================================== */

        const menuToggle =
            document.querySelector(
                '.menu-toggle'
            );


        const nav =
            document.querySelector(
                '.main-nav'
            );


        if (
            menuToggle &&
            nav
        ) {

            menuToggle.addEventListener(
                'click',
                () => {

                    nav.classList.toggle(
                        'open'
                    );


                    menuToggle.setAttribute(
                        'aria-expanded',
                        nav.classList.contains(
                            'open'
                        )
                    );
                }
            );
        }



        /* =====================================
           SUPABASE
           ===================================== */

        const SUPABASE_URL =
            'https://gxlquwudampvcuxiocmh.supabase.co';


        const SUPABASE_KEY =
            'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';


        const publicSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =====================================
           ID AGGIORNAMENTO
           ===================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const updateId =
            params.get('id');


        const detailContainer =
            document.getElementById(
                'updateDetail'
            );



        /* =====================================
           ESCAPE HTML
           ===================================== */

        function escapeHtml(value) {

            return String(
                value ?? ''
            )
                .replaceAll(
                    '&',
                    '&amp;'
                )
                .replaceAll(
                    '<',
                    '&lt;'
                )
                .replaceAll(
                    '>',
                    '&gt;'
                )
                .replaceAll(
                    '"',
                    '&quot;'
                )
                .replaceAll(
                    "'",
                    '&#039;'
                );
        }



        /* =====================================
           DATA
           ===================================== */

        function formatDate(value) {

            if (!value)
                return '';


            const date =
                new Date(value);


            return date.toLocaleDateString(
                'it-IT',
                {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric'
                }
            );
        }



        /* =====================================
           IMMAGINE
           ===================================== */

        function getImageUrl(
            imagePath
        ) {

            if (!imagePath)
                return null;


            const {
                data
            } =
                publicSupabase
                    .storage
                    .from('updates')
                    .getPublicUrl(
                        imagePath
                    );


            return data?.publicUrl
                || null;
        }



        /* =====================================
           CARICA AGGIORNAMENTO
           ===================================== */

        async function loadUpdate() {

            if (!updateId) {

                detailContainer.innerHTML =
                    `
                    <div class="update-detail-error">

                        Aggiornamento non valido.

                    </div>
                    `;

                return;
            }


            const {
                data,
                error
            } =
                await publicSupabase
                    .from('updates')
                    .select(`
                        id,
                        product_key,
                        product_name,
                        version,
                        title,
                        description,
                        content,
                        image_path,
                        published_at
                    `)
                    .eq(
                        'id',
                        updateId
                    )
                    .eq(
                        'published',
                        true
                    )
                    .single();


            if (
                error ||
                !data
            ) {

                console.error(error);


                detailContainer.innerHTML =
                    `
                    <div class="update-detail-error">

                        Aggiornamento non trovato
                        oppure non disponibile.

                    </div>
                    `;

                return;
            }


            renderUpdate(data);
        }



        /* =====================================
           MOSTRA AGGIORNAMENTO
           ===================================== */

        function renderUpdate(
            update
        ) {

            const imageUrl =
                getImageUrl(
                    update.image_path
                );


            const title =
                escapeHtml(
                    update.title
                );


            const product =
                escapeHtml(
                    update.product_name
                );


            const version =
                escapeHtml(
                    update.version || ''
                );


            const description =
                escapeHtml(
                    update.description || ''
                );


           const content =
    DOMPurify.sanitize(
        update.content || '',
        {
            ALLOWED_TAGS: [
                'p',
                'br',
                'strong',
                'b',
                'em',
                'i',
                'u',
                'h2',
                'h3',
                'h4',
                'ul',
                'ol',
                'li',
                'a'
            ],

            ALLOWED_ATTR: [
                'href',
                'target'
            ],

            FORBID_ATTR: [
                'style',
                'class'
            ]
        }
    );


            const date =
                formatDate(
                    update.published_at
                );


            let imageHtml = '';


            if (imageUrl) {

                imageHtml = `

                    <div class="update-detail-image">

                        <img
                            src="${escapeHtml(imageUrl)}"
                            alt="${title}"
                        >

                    </div>
                `;
            }


            detailContainer.innerHTML =
                `

                <article class="update-detail-article">

                    ${imageHtml}


                    <div class="update-detail-">

                        <span class="update-detail-product">

                            ${product}

                        </span>


                        <h1>
                            ${title}
                        </h1>


                        <div class="update-detail-meta">

                            <time>
                                ${date}
                            </time>

                            ${
                                version
                                ? `
                                    <span>
                                        Versione ${version}
                                    </span>
                                  `
                                : ''
                            }

                        </div>


                        ${
                            description
                            ? `
                                <p class="update-detail-description">

                                    ${description}

                                </p>
                              `
                            : ''
                        }


                        ${
                            content
                            ? `
                                <div class="update-detail-content">

                                    ${content}

                                </div>
                              `
                            : ''
                        }

                    </div>

                </article>
                `;


            /*
             * Aggiorniamo anche
             * il titolo della scheda browser.
             */
            document.title =
                update.title +
                ' | Turrin Elettronica';
        }



        /* =====================================
           AVVIO
           ===================================== */

        loadUpdate();

    </script>
<script src="js/components.js"></script>
</body>

</html>
