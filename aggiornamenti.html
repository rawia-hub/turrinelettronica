<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Aggiornamenti software e prodotti Turrin Elettronica."
    >

    <title>
        Aggiornamenti | Turrin Elettronica
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
         ========================= -->
<div
    id="siteHeader"
    data-root="./">
</div>


    <main>

        <!-- =========================
             TESTATA PAGINA
             ========================= -->

        <section class="updates-page-hero">

            <div class="container">

                <span class="updates-page-eyebrow">
                    Turrin Elettronica
                </span>

                <h1>
                    Aggiornamenti
                </h1>

                <p>
                    Scopri le ultime versioni,
                    funzionalità e novità disponibili
                    per i prodotti Turrin Elettronica.
                </p>

            </div>

        </section>


        <!-- =========================
             AGGIORNAMENTI
             ========================= -->

        <section class="updates-page">

            <div class="container">


                <!-- FILTRI -->

                <div
                    class="updates-filters"
                    id="updatesFilters">

                    <button
                        type="button"
                        class="updates-filter"
                        data-product="all">
                        Tutti
                    </button>

                    <button
                        type="button"
                        class="updates-filter"
                        data-product="mc3">
                        MC3
                    </button>

                    <button
                        type="button"
                        class="updates-filter"
                        data-product="trace">
                        T-Race Pro
                    </button>

                    <button
                        type="button"
                        class="updates-filter"
                        data-product="tuning">
                        Tuning Solution
                    </button>

                    <button
                        type="button"
                        class="updates-filter"
                        data-product="check">
                        Check ECU
                    </button>

                </div>


                <!-- GRID -->

                <div
                    class="updates-page-grid"
                    id="allUpdatesGrid">

                    <div class="updates-page-message">
                        Caricamento aggiornamenti...
                    </div>

                </div>

                <div class="updates-load-more">
                
                    <button
                        id="loadMoreButton"
                        class="load-more-button"
                        type="button">
                
                        Carica altri
                
                    </button>
                
                </div>
                <!-- NESSUN RISULTATO -->

                <div
                    class="updates-page-empty"
                    id="updatesEmpty">

                    Nessun aggiornamento disponibile
                    per questo prodotto.

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

<div id="siteFooter"></div>


    <!-- =========================
         SUPABASE
         ========================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <script>

        /* =====================================
           MENU MOBILE
           ===================================== */

        const menuToggle =
            document.querySelector(
                '.menu-toggle'
            );


        const nav =
            document.querySelector(
                '.main-nav'
            );


        if (
            menuToggle &&
            nav
        ) {

            menuToggle.addEventListener(
                'click',
                () => {

                    nav.classList.toggle(
                        'open'
                    );


                    menuToggle.setAttribute(
                        'aria-expanded',
                        nav.classList.contains(
                            'open'
                        )
                    );
                }
            );
        }



        /* =====================================
           SUPABASE
           ===================================== */

        const SUPABASE_URL =
            'https://gxlquwudampvcuxiocmh.supabase.co';


        const SUPABASE_KEY =
            'sb_publishable_TXv6HGzmzYe2c-CFD2hkkQ_qzkOa4XR';


        const publicSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =====================================
           ELEMENTI
           ===================================== */

        const updatesGrid =
            document.getElementById(
                'allUpdatesGrid'
            );


        const updatesEmpty =
            document.getElementById(
                'updatesEmpty'
            );


        const filterButtons =
            document.querySelectorAll(
                '.updates-filter'
            );


        let allUpdates = [];

        let currentFilter =
            'all';
        let visibleCount = 9;
        
        const ITEMS_PER_LOAD = 9;
        
        
        const loadMoreButton =
            document.getElementById(
                'loadMoreButton'
            );

        const urlParams =
            new URLSearchParams(
                window.location.search
            );
        
        
        const productFromUrl =
            urlParams.get(
                'product'
            );
        
        
        if (
            productFromUrl
        ) {
        
            currentFilter =
                productFromUrl;
        
        }
        /* =====================================
           ESCAPE HTML
           ===================================== */

        function escapeHtml(value) {

            return String(
                value ?? ''
            )
                .replaceAll(
                    '&',
                    '&amp;'
                )
                .replaceAll(
                    '<',
                    '&lt;'
                )
                .replaceAll(
                    '>',
                    '&gt;'
                )
                .replaceAll(
                    '"',
                    '&quot;'
                )
                .replaceAll(
                    "'",
                    '&#039;'
                );
        }



        /* =====================================
           DATA
           ===================================== */

        function formatDate(value) {

            if (!value)
                return '';


            const date =
                new Date(value);


            return date.toLocaleDateString(
                'it-IT',
                {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric'
                }
            );
        }



        /* =====================================
           URL IMMAGINE
           ===================================== */

        function getImageUrl(
            imagePath
        ) {

            if (!imagePath)
                return null;


            const {
                data
            } =
                publicSupabase
                    .storage
                    .from('updates')
                    .getPublicUrl(
                        imagePath
                    );


            return data?.publicUrl
                || null;
        }



        /* =====================================
           PLACEHOLDER
           ===================================== */

        function getProductClass(
            productKey
        ) {

            switch (
                productKey
            ) {

                case 'mc3':
                    return 'te-mc3';

                case 'trace':
                    return 'te-trace';

                case 'tuning':
                    return 'te-tuning';

                case 'check':
                    return 'te-check';

                default:
                    return 'te-mc3';
            }
        }



        /* =====================================
           CREA CARD
           ===================================== */

        function createUpdateCard(
            update
        ) {

            const imageUrl =
                getImageUrl(
                    update.image_path
                );


            const product =
                escapeHtml(
                    update.product_name
                );


            const title =
                escapeHtml(
                    update.title
                );


            const description =
                escapeHtml(
                    update.description ||
                    ''
                );


            const date =
                formatDate(
                    update.published_at
                );


            let imageHtml;


            if (imageUrl) {

                imageHtml = `

                    <div class="te-update-image">

                        <img
                            src="${escapeHtml(imageUrl)}"
                            alt="${title}"
                            loading="lazy"
                        >

                        <span
                            class="te-update-image-label">

                            ${product}

                        </span>

                    </div>
                `;

            }
            else {

                imageHtml = `

                    <div
                        class="
                            te-update-image
                            ${getProductClass(
                                update.product_key
                            )}
                        ">

                        <span>
                            ${product}
                        </span>

                    </div>
                `;
            }


            return `

                <article
                    class="updates-page-card">

                    ${imageHtml}


                    <div class="te-update-content">

                        <span
                            class="te-update-product">

                            ${product}

                        </span>


                        <h2>
                            ${title}
                        </h2>


                        <time>
                            ${date}
                        </time>


                        <p>
                            ${description}
                        </p>


                        <a
                            href="aggiornamento.html?id=${update.id}"
                            class="updates-read-more">

                            Leggi di più →

                        </a>

                    </div>

                </article>
            `;
        }



        /* =====================================
           MOSTRA AGGIORNAMENTI
           ===================================== */

 function renderUpdates() {

    let filteredUpdates;


    /* =====================================
       FILTRO
       ===================================== */

    if (
        currentFilter ===
        'all'
    ) {

        filteredUpdates =
            allUpdates;

    }
    else {

        filteredUpdates =
            allUpdates.filter(
                update =>
                    update.product_key ===
                    currentFilter
            );
    }


    /* =====================================
       NESSUN RISULTATO
       ===================================== */

    if (
        filteredUpdates.length ===
        0
    ) {

        updatesGrid.innerHTML =
            '';


        updatesEmpty.style.display =
            'block';


        loadMoreButton.style.display =
            'none';


        return;
    }


    updatesEmpty.style.display =
        'none';


    /* =====================================
       MOSTRA SOLO I PRIMI N
       ===================================== */

    const visibleUpdates =
        filteredUpdates.slice(
            0,
            visibleCount
        );


    updatesGrid.innerHTML =
        visibleUpdates
            .map(
                createUpdateCard
            )
            .join('');


    /* =====================================
       CARICA ALTRI
       ===================================== */

    if (
        visibleCount >=
        filteredUpdates.length
    ) {

        /*
         * Abbiamo già mostrato
         * tutto il database/filtro.
         */
        loadMoreButton.style.display =
            'none';

    }
    else {

        loadMoreButton.style.display =
            'inline-block';
    }
}
        loadMoreButton.addEventListener(
    'click',
    () => {

        visibleCount +=
            ITEMS_PER_LOAD;


        renderUpdates();

    }
);



        /* =====================================
           FILTRI
           ===================================== */

        filterButtons.forEach(
            button => {

                button.addEventListener(
                    'click',
                    () => {

                        filterButtons
                            .forEach(
                                item => {

                                    item.classList.remove(
                                        'active'
                                    );
                                }
                            );


                        button.classList.add(
                            'active'
                        );


                        currentFilter =
                            button.dataset.product;
                        visibleCount = 9;
                 updateActiveFilter();

                 renderUpdates();
         
                        const newUrl =
                    currentFilter === 'all'
                        ? 'aggiornamenti.html'
                        : 'aggiornamenti.html?product=' +
                          encodeURIComponent(
                              currentFilter
                          );
                
                
                window.history.replaceState(
                    {},
                    '',
                    newUrl
                );
                        visibleCount =
                            ITEMS_PER_LOAD;
                       

                    }
                );

            }
        );

function updateActiveFilter() {

    document
        .querySelectorAll(
            '.updates-filter'
        )
        .forEach(button => {

            button.classList.toggle(
                'active',
                button.dataset.product ===
                    currentFilter
            );

        });
}

        /* =====================================
           CARICA SUPABASE
           ===================================== */

        async function loadUpdates() {

            const {
                data,
                error
            } =
                await publicSupabase
                    .from('updates')
                    .select(`
                        id,
                        product_key,
                        product_name,
                        version,
                        title,
                        description,
                        image_path,
                        published_at
                    `)
                    .eq(
                        'published',
                        true
                    )
                    .order(
                        'published_at',
                        {
                            ascending:
                                false
                        }
                    );


            if (error) {

                console.error(
                    error
                );


                updatesGrid.innerHTML =
                    `

                    <div class="updates-page-message error">

                        Impossibile caricare
                        gli aggiornamenti.

                    </div>
                    `;


                return;
            }


            allUpdates =
                data || [];

updateActiveFilter();
            renderUpdates();

        }



        /* =====================================
           AVVIO
           ===================================== */

        loadUpdates();

    </script>
<script src="js/components.js"></script>
</body>

</html>
